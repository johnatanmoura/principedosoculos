<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pague com Pix - Príncipe dos Óculos</title>
<style>
  :root {
    --preto: #010101;
    --cartao: #0d0d0d;
    --linha: #3a2f12;
    --ouro: #d4a63a;
    --ouro-claro: #f0cf75;
    --prata: #c9c9c9;
    --texto: #f2f2f2;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--preto);
    color: var(--texto);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 360px;
    width: 100%;
    text-align: center;
    background: var(--cartao);
    border-radius: 20px;
    padding: 20px 24px 28px;
    border: 1px solid var(--linha);
    box-shadow: 0 0 0 1px rgba(212,166,58,.08), 0 10px 40px rgba(0,0,0,.6);
  }
  .logo { display: block; width: 100%; height: auto; border-radius: 12px; margin-bottom: 18px; }
  h1 { font-size: 16px; font-weight: 600; color: var(--ouro-claro); margin-bottom: 4px; }
  .subtitulo { font-size: 13px; color: var(--prata); margin-bottom: 22px; }
  .rotulo { font-size: 12px; color: #8d8d8d; margin-bottom: 6px; text-align: left; }
  .chave-box {
    border: 1px solid var(--linha);
    background: #16130a;
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 18px;
    color: var(--ouro-claro);
    margin-bottom: 14px;
    letter-spacing: 0.06em;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    word-break: break-all;
  }
  button, .btn {
    display: block;
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    font-family: inherit;
  }
  button {
    border: none;
    background: linear-gradient(180deg, var(--ouro-claro), var(--ouro));
    color: #1a1305;
    transition: filter .15s;
  }
  button:hover { filter: brightness(1.06); }
  button.copiado { background: #8f6f1e; color: #fff; }
  .btn {
    border: 1px solid var(--ouro);
    background: transparent;
    color: var(--ouro-claro);
    margin-top: 10px;
  }
  .btn:hover { background: #1b1607; }
  button:focus-visible, .btn:focus-visible { outline: 2px solid var(--ouro-claro); outline-offset: 2px; }
  .aviso { font-size: 12px; color: #8d8d8d; margin-top: 18px; }
</style>
</head>

  <button id="btnCopiar" onclick="copiarChave()">Copiar chave Pix</button>
  <a class="btn" id="linkWhatsapp" target="_blank" rel="noopener">Falar no WhatsApp</a>
  <a class="btn" id="linkInstagram" target="_blank" rel="noopener">Ver no Instagram</a>

  <div class="aviso">Copie a chave e cole no Pix do seu banco.</div>
</div>

<script>
const NOME_BENEFICIARIO = "Anderson Luis Mourão de Oliveira";
const CHAVE_PIX = "06823619333";
const WHATSAPP_NUMERO = "5585987673023";
const INSTAGRAM = "principe_dos_oculos";

document.getElementById('nomeExibido').textContent = NOME_BENEFICIARIO;
document.getElementById('chaveExibida').textContent = CHAVE_PIX;
document.getElementById('linkWhatsapp').href = "https://wa.me/" + WHATSAPP_NUMERO;
document.getElementById('linkInstagram').href = "https://instagram.com/" + INSTAGRAM;

function copiarChave() {
  const btn = document.getElementById('btnCopiar');
  const ok = () => {
    btn.textContent = "Chave copiada!";
    btn.classList.add('copiado');
    setTimeout(() => {
      btn.textContent = "Copiar chave Pix";
      btn.classList.remove('copiado');
    }, 2000);
  };
  const fallback = () => {
    const t = document.createElement('textarea');
    t.value = CHAVE_PIX;
    document.body.appendChild(t);
    t.select();
    try { document.execCommand('copy'); ok(); } catch (e) {}
    document.body.removeChild(t);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(CHAVE_PIX).then(ok, fallback);
  } else { fallback(); }
}
</script>

</body>
</html>
